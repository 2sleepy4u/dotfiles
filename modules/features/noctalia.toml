# Noctalia v5 config. Only non-default values; see
# https://docs.noctalia.dev/noctalia/configuration/ for every key.
# Built and validated by modules/features/noctalia.nix (any warning fails the build).
# After tweaking things in the settings GUI, run ./export-noctalia-settings.sh
# to fold them back in here.

[shell]
avatar_path = "~/face.png"

# Single source of truth for the system palette. Change it from the settings GUI
# or `noctalia msg color-scheme-set builtin <Name>` / `theme-mode-toggle`: noctalia
# re-renders the templates below and every app picks the colors up live.
[theme]
mode    = "dark"
source  = "builtin"
builtin = "Catppuccin"

# The app configs are generated by home-manager and already include the rendered
# files (see modules/features/noctalia.nix), so the templates' apply hooks find the
# include in place and only reload.
[theme.templates]
enable_builtin_templates   = true
builtin_ids                = ["gtk3", "gtk4", "qt", "alacritty"]
enable_community_templates = true
community_ids              = ["thunar", "tmux", "fzf", "papirus-icons"]

# niri's builtin hook appends an include to ~/.config/niri/config.kdl, which the
# wrapped niri doesn't read; render the same template without a hook instead.
[theme.templates.user.niri]
input_path  = "templates/niri.kdl"
output_path = "$XDG_CONFIG_HOME/niri/noctalia.kdl"

# community `fuzzel` template, vendored with an opaque background
# (noctalia-fuzzel.conf); fuzzel.ini already includes the output, so no hook.
[theme.templates.user.fuzzel]
input_path  = "templates/fuzzel.conf"
output_path = "$XDG_CONFIG_HOME/fuzzel/themes/noctalia"

# community `neovim` template, vendored with base16 mapped by hue (noctalia-nvim.lua).
# The rendered module reloads itself on SIGUSR1; -x so nothing else named *nvim*
# gets a signal whose default action is to terminate.
[theme.templates.user.nvim]
input_path  = "templates/nvim.lua"
output_path = "$XDG_CONFIG_HOME/nvim/lua/matugen.lua"
post_hook   = "pkill -USR1 -x nvim || true"

[wallpaper]
enabled   = true
directory = "~/Pictures/Wallpapers"

[weather]
enabled = true

[location]
address = "Italy"

[nightlight]
enabled           = true
temperature_night = 3100

[bar.main]
position           = "right"
background_opacity = 0.93
capsule            = true
start  = ["clock", "launcher", "active-window", "media", "taskbar"]
center = ["workspaces"]
end    = ["tray", "settings", "notifications", "battery", "volume", "brightness", "bluetooth", "clipboard"]
